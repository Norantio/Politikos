[project]
name = "politikos"
version = "0.1.0"
description = "Real-time U.S. elections dashboard backed by civicAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "apscheduler>=3.10",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["politikos*"]
