server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + WebSocket proxy → politikos-api container.
    # When served behind Flotilla nginx, the outer nginx strips the
    # /apps/politikos prefix, so requests arrive here as /api/... and /ws.
    location /api/ {
        proxy_pass         http://api:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /ws {
        proxy_pass         http://api:8090;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /healthz {
        proxy_pass         http://api:8090/healthz;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
