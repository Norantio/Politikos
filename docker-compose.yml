services:
  postgres:
    image: postgres:16-alpine
    container_name: politikos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-politikos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-politikos}
      POSTGRES_DB: ${POSTGRES_DB:-politikos}
    volumes:
      - politikos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-politikos}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: politikos-redis
    restart: unless-stopped
    volumes:
      - politikos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    image: politikos-api:latest
    container_name: politikos-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8090/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    image: politikos-web:latest
    container_name: politikos-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  politikos-pg:
  politikos-redis:
